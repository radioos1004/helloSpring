version: '3'

services:
  # Nginx: 외부 요청을 받아 Blue 또는 Green으로 전달
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"  # 사용자는 80포트로 접속
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/service-url.inc:/etc/nginx/conf.d/service-url.inc:ro
    # depends_on:
    #  - app-blue
    #  - app-green
    networks:
      - app-network

  # Blue 환경
  app-blue:
    image: my-java-app:latest
    container_name: app-blue
    expose:
      - "8081"
    environment:
      - TZ=Asia/Seoul
      - SERVER_PORT=8081 # 자바 앱 내부 포트 설정
    networks:
      - app-network

  # Green 환경
  app-green:
    image: my-java-app:latest
    container_name: app-green
    expose:
      - "8081"
    environment:
      - TZ=Asia/Seoul
      - SERVER_PORT=8081 # 자바 앱 내부 포트 설정
    networks:
      - app-network

networks:
  app-network:
    driver: bridge